runs_root: runs
exp_name: 'rl-codec'
run_id:
ddp_backend: nccl
sampling_rate: 16000
ddp_find_unused_parameters: false

# Data Path
train_shards_path: path/to/train_shards_50k.txt
input_validation_wav_list: path/to/valid.scp

test_input_wavs_dir: path/to/test_wavs_dir

# Mel
n_fft: 1024
win_size: 512
hop_size: 160
num_mels: 80
mel_padding: center


# Encoder
encoder_input_channels: 80
encoder_in_dim: 256
encoder_num_layers: [4,8,12]
down_ratio: [2,2,2]
encoder_embed_kernel_size: 11
mel_Encoder_channel: 512
mel_Encoder_convnext_kernel_size: [6,6,6]
mel_Encoder_output_kernel_size: 11
latent_output_conv_kernel_size: 11
latent_dim: 32

# Quantizer
quantizer_type: rfsq
levels: [8,8,8,8]
stochastic: False
num_quantizers: 2
temp_steps: 30000

# Decoder
decoder_base_dim: 256
decoder_num_layers: [12,8,4]
latent_input_conv_kernel_size: 11
mel_Decoder_channel: 512
mel_Decoder_input_kernel_size: 11
mel_Decoder_convnext_kernel_size: [6,6,6]
up_ratio: [2,2,2]
mel_Decoder_output_conv_kernel_size: 11
decoder_output_channels: 80

# Discriminator
msd_channels: 32

mpd_channels: 32
mpd_kernel_size: 5
mpd_stride: 3

mrd_channels: 32
mrd_loss_coeff: 0.2

# Training
train_batch_size: 64
valid_batch_size: 64
learning_rate: 0.001
adam_b1: 0.8
adam_b2: 0.9
pct_start: 0.05
div_factor: 25
final_div_factor: 100
seed: 1234
max_training_steps: 500000
summary_interval: 100
validation_interval: 1000
train_segment_size: 63840
valid_segment_size: 63840
sample_shuffle: 10000
num_workers: 4
use_gradient_clipping: False

start_gan_steps: 0
gan_warmup_steps: 10000
mel_l1_weight: 15.0

# Save checkpoint
checkpoint_file_load_Codec: path/to/codec_checkpoint
checkpoint_file_load_Vocos: path/to/vocos_checkpoint

# Inference
test_wav_output_dir: runs/eval/output_wav
vis_output_dir: runs/eval/vis


# Vocos
vocos_backbone_input_channels: 80
vocos_backbone_dim: 512
vocos_backbone_intermediate_dim: 1536
vocos_backbone_num_layers: 12
vocos_head_dim: 512
vocos_head_n_fft: 1024
vocos_head_win_length: 512
vocos_head_hop_length: 160
vocos_head_padding: center


# Metrics
wer_log_file_path: runs/eval/metrics/wer.txt
wer_detailed_file_path: runs/eval/metrics/wer_details.csv
ref_path: path/to/reference_text.trn
hyp_path: runs/eval/metrics/hyp_text.trn

metrics_log_file_path: runs/eval/metrics/audio_metrics.txt
metrics_detailed_log_path: runs/eval/metrics/audio_metrics_details.csv

rl:
  checkpoint_path_codec: path/to/first_stage_codec_checkpoint
  checkpoint_path_vocos: path/to/first_stage_vocos_checkpoint
  train_batch_size: 8
  valid_batch_size: 8
  train_segment_size: 81760
  valid_segment_size: 81760
  group_size: 16
  learning_rate: 1.0e-5
  max_training_steps: 100000
  validation_interval: 1000
  temperature: 1.0
  rl_weight: 10.0
  mel_l1_weight: 1.0
  use_gradient_clipping: False
  gradient_clip_norm: 1.0
